name: build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.fyne_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            fyne_os: linux
            artifact: proto-viewer-linux
          - runner: macos-14
            fyne_os: darwin
            artifact: proto-viewer-macos
          - runner: windows-latest
            fyne_os: windows
            artifact: proto-viewer-windows
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne (GLFW/OpenGL, CGO) требует dev-пакетов GUI на Linux.
      - name: Install Linux GUI deps
        if: matrix.fyne_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build & test
        run: |
          go build ./...
          go test ./internal/...

      # Иконку резолвим абсолютным путём: с --source-dir fyne ищет её
      # относительно source-dir, а не корня репозитория.
      - name: Package
        shell: bash
        run: fyne package --os ${{ matrix.fyne_os }} --source-dir ./cmd/app --name "Proto Viewer" --app-id com.i4erkasov.proto-viewer --icon "$GITHUB_WORKSPACE/assets/icon.png"

      # Делаем бинарь внутри .app универсальным (arm64 + x86_64), чтобы один
      # .app работал на любом Mac. Раннер arm64: fyne уже собрал arm64-слайс;
      # докомпилируем x86_64 (SDK macOS универсальный) и склеиваем через lipo.
      - name: Universal macOS binary
        if: matrix.fyne_os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find . -maxdepth 3 -name "*.app" -type d | head -1)
          EXE=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)
          echo "app: $APP"
          echo "exe: $EXE"
          CGO_ENABLED=1 GOARCH=amd64 \
            CC="clang -arch x86_64" \
            CGO_CFLAGS="-arch x86_64" \
            CGO_LDFLAGS="-arch x86_64" \
            go build -o /tmp/pv-amd64 ./cmd/app
          lipo -create "$EXE" /tmp/pv-amd64 -output /tmp/pv-universal
          mv /tmp/pv-universal "$EXE"
          chmod +x "$EXE"
          echo "result:"
          lipo -info "$EXE"

      # .app — это каталог; упаковываем в zip для артефакта.
      - name: Zip .app (macOS)
        if: matrix.fyne_os == 'darwin'
        run: |
          APP=$(find . -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            ditto -c -k --keepParent "$APP" "Proto-Viewer-macos.zip"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            **/*.exe
            **/*.tar.xz
            **/*.zip
            **/*.msi
          if-no-files-found: warn